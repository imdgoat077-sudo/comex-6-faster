<!doctype html>
<meta charset="utf-8">
<title>Word game fixture</title>
<style>
  body { margin: 0; background: #121213; color: #fff; font: 16px system-ui, sans-serif; }
  #game { max-width: 360px; margin: 24px auto; text-align: center; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 5px 0; }
  .tile { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; text-transform: uppercase; border: 2px solid #3a3a3c; }
  .tile[data-state=tbd] { border-color: #565758; }
  .tile[data-state=absent] { background: #3a3a3c; border-color: #3a3a3c; }
  .tile[data-state=present] { background: #b59f3b; border-color: #b59f3b; }
  .tile[data-state=correct] { background: #538d4e; border-color: #538d4e; }
  #message { min-height: 24px; margin-top: 12px; }
</style>
<!-- Keyboard only: no on-screen keys, so letters cannot be clicked. -->
<div id="game" data-status="playing" tabindex="-1">
  <h1>Word game</h1>
  <div id="rows" role="group" aria-label="Guesses"></div>
  <div id="message" role="status"></div>
</div>
<script>
const seed = parseInt(new URLSearchParams(location.search).get('seed') || '0', 10);
const ORD = ['1st', '2nd', '3rd', '4th', '5th'];
const gameEl = document.getElementById('game'), rowsEl = document.getElementById('rows'), msg = document.getElementById('message');
let row = 0, col = 0, guess = [], busy = false;
const tiles = [];
for (let r = 0; r < 6; r++) { const rowEl = document.createElement('div'); rowEl.className = 'row'; rowEl.setAttribute('role', 'group'); rowEl.setAttribute('aria-label', 'Row ' + (r + 1));
  tiles.push([]); for (let c = 0; c < 5; c++) { const t = document.createElement('div'); t.className = 'tile'; t.dataset.state = 'empty';
    t.setAttribute('aria-label', 'empty'); rowEl.appendChild(t); tiles[r].push(t); } rowsEl.appendChild(rowEl); }
function show(text) { msg.textContent = text; }
document.addEventListener('keydown', (e) => {
  if (gameEl.dataset.status !== 'playing' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[a-zA-Z]$/.test(e.key) && col < 5) { const ch = e.key.toLowerCase(); guess[col] = ch; const t = tiles[row][col];
    t.textContent = ch; t.dataset.state = 'tbd'; t.setAttribute('aria-label', ch + ', tbd'); col++; show(''); }
  else if (e.key === 'Backspace' && col > 0) { col--; const t = tiles[row][col]; t.textContent = ''; t.dataset.state = 'empty'; t.setAttribute('aria-label', 'empty'); guess.length = col; }
  else if (e.key === 'Enter') {
    if (col < 5) { show('Not enough letters'); return; }
    if (busy) return;
    const g = guess.join(''); busy = true;
    // The answer lives on the server: the page only learns the feedback for a guess.
    fetch('/api/score', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ seed, guess: g, attempt: row }) })
      .then(r => r.json()).then((r) => {
        busy = false;
        if (!r.valid) { show('Not in word list'); return; }
        r.result.forEach((s, i) => { tiles[row][i].dataset.state = s; tiles[row][i].setAttribute('aria-label', `${ORD[i]} letter, ${g[i].toUpperCase()}, ${s}`); });
        if (r.won) { gameEl.dataset.status = 'won'; show('You won in ' + (row + 1)); }
        else if (row === 5) { gameEl.dataset.status = 'lost'; show('Out of guesses'); }
        else { row++; col = 0; guess = []; show(''); }
      }).catch(() => { busy = false; show('Network error'); });
  }
});
window.__wordle = {};  // nothing about the answer exists in the page
</script>
